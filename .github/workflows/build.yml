name: Build

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -q --orphan ci-log
          git rm -rq --cached . || true
          { echo "commit: ${{ github.sha }}"; echo "--- conditions ---"; node -v; npm -v; echo "--- build.log ---"; cat build.log 2>/dev/null || echo "no build.log"; } > ci-build.log
          git add -f ci-build.log
          git commit -qm "ci-build.log for ${{ github.sha }}"
          git push -f origin ci-log

      - name: Verify output
        run: |
          test -f dist/index.html
          test -f dist/ru/index.html
          test -f dist/experience/index.html
          grep -q 'lang="ru"' dist/ru/index.html
          du -sh dist
          find dist -maxdepth 1 -type d | sort

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
