name: Build

# The repository only allows actions from repositories owned by evgenykon,
# so this workflow uses no `uses:` at all — plain shell + the preinstalled
# Node.js on the runner.

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          git log --oneline -1
          node -v
          npm -v

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/ru/index.html
          test -f dist/experience/index.html
          grep -q 'lang="ru"' dist/ru/index.html
          du -sh dist
          find dist -maxdepth 1 -type d | sort
