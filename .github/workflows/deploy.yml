name: Deploy to GitHub Pages

# Builds on GitHub Actions and publishes dist/ to the gh-pages branch, which is
# what the repository's Pages source points at. No marketplace actions are used:
# the repository only allows actions owned by evgenykon, so checkout and publish
# are done with plain git over the GITHUB_TOKEN.

on:
  push:
    branches: [astro, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          git log --oneline -1
          node -v
          npm -v

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/ru/index.html
          test -f dist/experience/index.html
          du -sh dist
          find dist -maxdepth 1 -type d | sort

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          cd dist
          touch .nojekyll
          git init -q .
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "deploy: ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "published ${GITHUB_SHA} to gh-pages"
