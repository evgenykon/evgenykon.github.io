services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    ports:
      - "13201:4321"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=1
      - NODE_ENV=development

volumes:
  node_modules:
